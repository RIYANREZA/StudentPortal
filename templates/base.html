<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Student Portal
        {% endblock %}
    </title>

    <link
    href="{{ url_for('static', filename='css/output.css') }}"
    rel="stylesheet">

</head>

<body class="bg-slate-950 text-white min-h-screen">

<nav class="bg-slate-900 border-b border-slate-800">

    <div class="max-w-7xl mx-auto flex justify-between items-center p-5">

        <h1
        class="text-3xl font-bold text-green-400">

            🎓 Student Portal

        </h1>

        <div class="space-x-8">

            <a href="/"
            class="hover:text-green-400 transition">

                Home

            </a>

            <a href="/add-student"
            class="hover:text-green-400 transition">

                Add Student

            </a>

            <a href="/students"
            class="hover:text-green-400 transition">

                Students

            </a>
            <a
    href="/register"
    class="hover:text-green-400 transition">

    Register

</a>
<a
    href="/login"
    class="hover:text-green-400 transition">

    Login

</a>
<a href="/logout">
    Logout
</a>

        </div>

    </div>

</nav>
{% with messages = get_flashed_messages(with_categories=true) %}

    {% if messages %}

        {% for category, message in messages %}

            <div class="max-w-7xl mx-auto mt-6">

                <div class="bg-green-500/20 border border-green-500 text-green-300 px-6 py-4 rounded-xl">

                    {{ message }}

                </div>

            </div>

        {% endfor %}

    {% endif %}

{% endwith %}


{% block content %}

{% endblock %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>

</html>
