{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="max-w-md mx-auto mt-16 bg-slate-900 p-8 rounded-2xl shadow-lg border border-slate-700">

    <h2 class="text-3xl font-bold text-green-400 mb-6 text-center">
        Login
    </h2>

    <form action="/login-user" method="POST">

        <div class="mb-4">

            <label class="block mb-2 text-slate-300">
                Username
            </label>

            <input
                type="text"
                name="username"
                required
                class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700">

        </div>

        <div class="mb-6">

            <label class="block mb-2 text-slate-300">
                Password
            </label>

            <input
                type="password"
                name="password"
                required
                class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700">

        </div>

        <button
            type="submit"
            class="w-full bg-green-500 hover:bg-green-400 text-black font-bold py-3 rounded-lg">

            Login

        </button>

    </form>

</div>

{% endblock %}
