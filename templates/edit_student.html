{% extends "base.html" %}

{% block title %}
Edit Student
{% endblock %}

{% block content %}

<section class="max-w-3xl mx-auto mt-16 px-6">

    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-10 shadow-2xl">

        <h2 class="text-5xl font-bold text-yellow-400">

            ✏️ Edit Student

        </h2>

        <p class="text-slate-400 mt-4">

            Update student information.

        </p>

        <form
        action="/update-student/{{ student['_id'] }}"
        method="POST"
        class="mt-10 space-y-6">

            <div>

                <label class="block mb-2">

                    Full Name

                </label>

                <input

                type="text"

                name="name"

                value="{{ student['name'] }}"

                class="w-full bg-slate-950 border border-slate-700 rounded-xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-green-500">

            </div>

            <div>

                <label class="block mb-2">

                    Age

                </label>

                <input

                type="number"

                name="age"

                value="{{ student['age'] }}"

                class="w-full bg-slate-950 border border-slate-700 rounded-xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-green-500">

            </div>

            <div>

                <label class="block mb-2">

                    Branch

                </label>

                <input

                type="text"

                name="branch"

                value="{{ student['branch'] }}"

                class="w-full bg-slate-950 border border-slate-700 rounded-xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-green-500">

            </div>

            <button

            type="submit"

            class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-4 rounded-xl transition-all hover:scale-105">

                Update Student

            </button>

        </form>

    </div>

</section>

{% endblock %}
